<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Reading Simulation - Diagnostic Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; user-select: none; }
        .split-container { height: calc(100vh - 160px); }
        .scroll-custom::-webkit-scrollbar { width: 6px; }
        .scroll-custom::-webkit-scrollbar-track { background: #f1f1f1; }
        .scroll-custom::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        .highlight-location { background-color: #fef08a; font-weight: 600; padding: 0 4px; border-radius: 4px; box-shadow: 0 0 0 2px #fef08a; }
        .user-highlight { background-color: #bbf7d0; cursor: pointer; border-radius: 2px; }
        .user-highlight:hover { background-color: #86efac; }
        .question-dot { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; font-size: 11px; font-weight: 600; flex-shrink: 0; }
        .question-dot.answered { background-color: #1d4ed8; color: white; }
        .question-dot.unanswered { border: 1px solid #d1d5db; color: #6b7280; }
        .question-dot.current { border: 2px solid #1d4ed8; background-color: #eff6ff; }
        .question-dot.correct { background-color: #16a34a !important; color: white !important; border: none !important; }
        .question-dot.wrong { background-color: #dc2626 !important; color: white !important; border: none !important; }
        .cloze-input { border-bottom: 2px solid #3b82f6; border-top: none; border-left: none; border-right: none; background: transparent; outline: none; padding: 0 5px; font-weight: 600; text-align: center; min-width: 100px; }
        .instruction-box { background-color: #f8fafc; border-left: 4px solid #94a3b8; padding: 12px; margin-bottom: 20px; font-style: italic; color: #475569; font-size: 0.95rem; white-space: pre-wrap; }
        #hl-button { display: none; position: absolute; z-index: 100; background: #1d4ed8; color: white; padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        #passage-content { user-select: text; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 overflow-hidden">
    <div id="hl-button" onclick="applyHighlight()">Highlight</div>

    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-white">
        <div class="max-w-md w-full p-10 border rounded-2xl shadow-xl">
            <h1 class="text-3xl font-black mb-2 text-blue-800 tracking-tighter uppercase">IELTS Reading</h1>
            <p class="text-gray-500 mb-8 font-medium">Computer-delivered Simulation</p>
            <input type="text" id="user-name" placeholder="Enter your full name" class="w-full p-4 border-2 rounded-xl mb-4 outline-none">
            <button onclick="startTest()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-blue-700">Start Examination</button>
        </div>
    </div>

    <header class="bg-white border-b px-8 py-4 flex justify-between items-center shadow-sm relative z-10">
        <div class="flex items-center gap-6">
            <div class="text-blue-700 font-black text-xl">IELTS<span class="text-gray-400 font-light ml-1">SIM</span></div>
            <div id="display-name" class="text-sm font-bold text-gray-600 border-l pl-6 uppercase tracking-wider">---</div>
        </div>
        <div id="timer" class="text-2xl font-mono font-black text-red-600 bg-red-50 px-6 py-2 rounded-xl border-2 border-red-100">60:00</div>
        <div class="flex gap-3">
            <button id="submit-btn" onclick="confirmSubmit()" class="bg-green-600 text-white px-8 py-2.5 rounded-lg font-bold shadow-md hover:bg-green-700">Finish Test</button>
            <button id="exit-btn" onclick="location.reload()" class="hidden bg-gray-200 text-gray-700 px-8 py-2.5 rounded-lg font-bold hover:bg-gray-300">Exit Review</button>
        </div>
    </header>

    <main class="flex split-container">
        <div id="passage-side" class="w-1/2 p-10 overflow-y-auto border-r bg-white scroll-custom">
            <div id="passage-content" class="prose max-w-none font-serif text-lg leading-relaxed text-gray-800" onmouseup="handleSelection(event)">
                <div class="flex items-center justify-center h-full text-gray-400 italic">Loading...</div>
            </div>
        </div>
        <div id="question-side" class="w-1/2 p-10 overflow-y-auto bg-gray-50 scroll-custom">
            <div class="mb-6 flex justify-between items-center bg-blue-50 p-4 rounded-xl border border-blue-100">
                <span id="passage-label" class="font-bold text-blue-800 uppercase tracking-widest text-sm">Passage 1 of 3</span>
                <div class="flex gap-2">
                    <button id="prev-page" onclick="changePage(-1)" class="p-2 bg-white border rounded-lg disabled:opacity-30"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></button>
                    <button id="next-page" onclick="changePage(1)" class="p-2 bg-white border rounded-lg disabled:opacity-30"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></button>
                </div>
            </div>
            <div id="questions-list" class="space-y-10"></div>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 h-24 bg-white border-t px-8 py-3 flex items-center gap-4 overflow-x-auto">
        <div id="nav-dots" class="flex gap-2.5 mx-auto"></div>
    </footer>

    <div id="result-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="bg-white p-10 rounded-3xl shadow-2xl max-w-sm w-full text-center border-4 border-blue-100">
            <h2 class="text-2xl font-black mb-2 text-gray-800">Test Result</h2>
            <div class="text-7xl font-black text-blue-600 mb-4 tracking-tighter" id="score-display">0.0</div>
            <p class="text-lg font-bold text-gray-800 mb-8" id="raw-score-display">0/40 correct</p>
            <button onclick="reviewTest()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold hover:bg-blue-700 transition shadow-lg">Review Answers</button>
        </div>
    </div>

    <script>
        let examData = null, answerData = null, userAnswers = {}, currentPage = 0, timeRemaining = 3600, timerInterval = null, isReviewMode = false;
        let selectedRange = null;

        async function loadData() {
            // Tự động định vị đường dẫn thư mục hiện tại để không bị lệch đường dẫn trên GitHub Pages
            const baseHref = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
            const examUrl = baseHref + 'exam.json';
            const answersUrl = baseHref + 'answers.json';

            try {
                const [eRes, aRes] = await Promise.all([
                    fetch(examUrl).catch(err => { throw new Error(`Could not fetch exam.json from ${examUrl}`) }),
                    fetch(answersUrl).catch(err => { throw new Error(`Could not fetch answers.json from ${answersUrl}`) })
                ]);
                
                if (!eRes.ok) {
                    throw new Error(`File exam.json failed to load.\nURL: ${examUrl}\nStatus: ${eRes.status} (${eRes.statusText})`);
                }
                if (!aRes.ok) {
                    throw new Error(`File answers.json failed to load.\nURL: ${answersUrl}\nStatus: ${aRes.status} (${aRes.statusText})`);
                }

                examData = await eRes.json();
                answerData = await aRes.json();
                renderPassage();
                renderNav();
            } catch(e) {
                console.error(e);
                alert(`[DIAGNOSTIC ERROR]\n\n${e.message}\n\nPlease check if your files on GitHub have the correct spelling, are in lowercase, and are placed in the correct repository root.`);
            }
        }

        function startTest() {
            const name = document.getElementById('user-name').value.trim();
            if (!name) return;
            document.getElementById('display-name').innerText = name;
            document.getElementById('login-screen').classList.add('hidden');
            loadData();
            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                if (timeRemaining <= 0) { clearInterval(timerInterval); submitTest(); }
                const m = Math.floor(timeRemaining/60), s = timeRemaining%60;
                document.getElementById('timer').innerText = `${m}:${s.toString().padStart(2,'0')}`;
            }, 1000);
        }

        function handleSelection(e) {
            if (isReviewMode) return;
            const s = window.getSelection();
            const btn = document.getElementById('hl-button');
            if (s.rangeCount > 0 && s.toString().trim().length > 0) {
                selectedRange = s.getRangeAt(0).cloneRange();
                const r = s.getRangeAt(0).getBoundingClientRect();
                btn.style.top = `${r.top + window.scrollY - 30}px`;
                btn.style.left = `${r.left + window.scrollX}px`;
                btn.style.display = 'block';
            } else { btn.style.display = 'none'; }
        }

        function applyHighlight() {
            if (!selectedRange) return;
            const span = document.createElement('span');
            span.className = 'user-highlight';
            span.onclick = function() { this.replaceWith(...this.childNodes); };
            try { selectedRange.surroundContents(span); } catch(e) {}
            window.getSelection().removeAllRanges();
            document.getElementById('hl-button').style.display = 'none';
        }

        // Hàm so sánh đáp án thông minh
        function isMatch(userVal, correctVal) {
            if (!userVal || !correctVal) return false;
            let u = userVal.toString().toUpperCase().trim();
            let c = correctVal.toString().toUpperCase().trim();
            
            // 1. Khớp hoàn toàn
            if (u === c) return true;
            
            // 2. Khớp chữ cái đầu (Ví dụ: "A" khớp với "A. SOME TEXT")
            if (u.length === 1 && (c.startsWith(u + ".") || c.startsWith(u + " "))) return true;
            if (c.length === 1 && (u.startsWith(c + ".") || u.startsWith(c + " "))) return true;
            
            return false;
        }

        function renderPassage() {
            if (!examData) return;
            const sec = examData.sections[currentPage];
            document.getElementById('passage-label').innerText = `Passage ${currentPage + 1} of 3`;
            document.getElementById('passage-content').innerHTML = `
                <h1 class="text-3xl font-black mb-6 italic text-gray-900 border-b-4 border-blue-600 inline-block pb-1 uppercase">${sec.title}</h1>
                <div class="passage-text leading-loose space-y-6">${sec.content}</div>
            `;
            const qList = document.getElementById('questions-list');
            qList.innerHTML = '';
            sec.questions.forEach(q => {
                if (q.instruction) {
                    const i = document.createElement('div');
                    i.className = 'instruction-box';
                    i.innerHTML = `<strong>Instructions:</strong><br>${q.instruction}`;
                    qList.appendChild(i);
                }
                const card = document.createElement('div');
                card.className = `p-8 bg-white border-2 rounded-2xl shadow-sm`;
                card.id = `card-${q.id || q.ids?.[0]}`;
                let html = '';
                if (q.type === 'mc') {
                    html = `<div class="flex gap-4"><span class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold flex-shrink-0">${q.id}</span><div class="w-full"><p class="font-bold text-lg mb-4">${q.text}</p><div class="grid gap-2">
                        ${q.options.map(opt => {
                            const letter = opt.trim().charAt(0).toUpperCase();
                            return `<label class="flex items-center p-4 border rounded-xl cursor-pointer hover:bg-blue-50 transition">
                                <input type="radio" name="q${q.id}" value="${letter}" ${userAnswers[q.id] === letter ? 'checked' : ''} onchange="saveAns(${q.id}, this.value)" class="w-5 h-5">
                                <span class="ml-4 font-medium">${opt}</span>
                            </label>`;
                        }).join('')}
                    </div></div></div>`;
                } else if (q.type === 'cloze') {
                    let txt = q.text;
                    q.ids.forEach(id => {
                        txt = txt.replace(`{${id}}`, `<input type="text" class="cloze-input" value="${userAnswers[id] || ''}" oninput="saveAns(${id}, this.value)" placeholder="...">`);
                    });
                    html = `<div class="p-2 leading-loose font-medium text-gray-700">${txt}</div>`;
                } else if (q.type === 'multi') {
                    html = `<div class="w-full"><p class="font-bold text-lg mb-4">${q.text}</p><div class="grid gap-2">
                        ${q.options.map(opt => {
                            const letter = opt.trim().charAt(0).toUpperCase();
                            return `<label class="flex items-center p-4 border rounded-xl cursor-pointer hover:bg-blue-50 transition">
                                <input type="checkbox" value="${letter}" onchange="saveMulti(${JSON.stringify(q.ids)}, this.value)" ${isMultiChecked(q.ids, letter) ? 'checked' : ''} class="w-5 h-5 rounded">
                                <span class="ml-4 font-medium">${opt}</span>
                            </label>`;
                        }).join('')}
                    </div></div>`;
                } else if (q.type === 'inline') {
                    html = `<div class="flex items-center gap-4 py-3 border-b">
                        <span class="w-7 h-7 rounded bg-gray-200 text-gray-700 flex items-center justify-center font-bold text-xs">${q.id}</span>
                        <p class="flex-grow font-medium">${q.text}</p>
                        <input type="text" value="${userAnswers[q.id] || ''}" oninput="saveAns(${q.id}, this.value)" class="p-2 border-2 rounded-lg w-36 font-bold uppercase focus:border-blue-500 outline-none text-center">
                    </div>`;
                }
                if (isReviewMode) {
                    const ids = q.ids || [q.id];
                    ids.forEach(id => {
                        if (!answerData[id]) return;
                        const ok = checkIndividualAnswer(id);
                        html += `<div class="mt-4 p-4 ${ok ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800'} rounded-xl text-sm border">
                            <div class="font-black mb-1">Question ${id}: ${ok ? '✓ Correct' : '✗ Incorrect'}</div>
                            <div><strong>Correct Answer:</strong> ${answerData[id].answer}</div>
                            <div class="mt-1 text-xs opacity-80 italic">Reason: ${answerData[id].explanation}</div>
                            <button onclick="gotoLoc('${answerData[id].locationId}')" class="mt-2 font-bold text-blue-600 underline">Find in passage</button>
                        </div>`;
                    });
                }
                card.innerHTML = html;
                qList.appendChild(card);
            });
            updateNav();
        }

        function saveAns(id, val) { if (!isReviewMode) { userAnswers[id] = val.trim(); updateNav(); } }
        
        function saveMulti(ids, val) {
            if (isReviewMode) return;
            if (isMultiChecked(ids, val)) {
                const idToRemove = ids.find(id => userAnswers[id] === val);
                delete userAnswers[idToRemove];
            } else {
                const nextId = ids.find(id => !userAnswers[id]);
                if (nextId) userAnswers[nextId] = val;
            }
            updateNav(); renderPassage();
        }
        
        function isMultiChecked(ids, val) { return ids.some(id => userAnswers[id] === val); }
        
        function changePage(dir) { currentPage += dir; renderPassage(); }
        
        function renderNav() {
            const n = document.getElementById('nav-dots'); n.innerHTML = '';
            for (let i=1; i<=40; i++) {
                const d = document.createElement('div'); d.id = `dot-${i}`; d.className = 'question-dot unanswered'; d.innerText = i;
                d.onclick = () => jumpToQuestion(i); n.appendChild(d);
            }
            updateNav();
        }
        
        function updateNav() {
            if (!examData) return;
            for (let i=1; i<=40; i++) {
                const d = document.getElementById(`dot-${i}`); if (!d) continue;
                d.classList.remove('current', 'answered', 'unanswered', 'correct', 'wrong');
                
                if (examData.sections[currentPage]) {
                    const has = examData.sections[currentPage].questions.some(q => (q.id === i || (q.ids && q.ids.includes(i))));
                    if (has) d.classList.add('current');
                }
                
                if (isReviewMode) {
                    const ok = checkIndividualAnswer(i);
                    d.classList.add(ok ? 'correct' : 'wrong');
                } else {
                    d.classList.add(userAnswers[i] ? 'answered' : 'unanswered');
                }
            }
        }

        function checkIndividualAnswer(id) {
            if (!answerData || !answerData[id]) return false;
            const u = (userAnswers[id] || "");
            const c = answerData[id].answer;
            
            // Kiểm tra xem câu này có nằm trong nhóm chọn nhiều không
            let multiGroup = null;
            examData.sections.forEach(sec => {
                sec.questions.forEach(q => {
                    if (q.ids && q.ids.includes(id)) multiGroup = q.ids;
                });
            });

            if (multiGroup) {
                // Với Multi-select: kiểm tra xem đáp án có nằm trong tập hợp đáp án đúng của nhóm không
                const correctSet = multiGroup.map(gid => answerData[gid].answer);
                return u !== "" && correctSet.some(cVal => isMatch(u, cVal));
            }
            
            return isMatch(u, c);
        }

        function jumpToQuestion(num) {
            let t = -1; examData.sections.forEach((s, idx) => { if (s.questions.some(q => (q.id === num || (q.ids && q.ids.includes(num))))) t = idx; });
            if (t !== -1 && t !== currentPage) { currentPage = t; renderPassage(); }
            setTimeout(() => { const el = document.getElementById(`card-${num}`); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
        }
        
        function confirmSubmit() { if (confirm("Do you want to submit your test?")) submitTest(); }
        
        function submitTest() {
            clearInterval(timerInterval);
            let finalScore = 0;
            const scoredIds = new Set();

            // 1. Chấm điểm theo nhóm (Multi-select) cho 11-13
            examData.sections.forEach(sec => {
                sec.questions.forEach(q => {
                    if (q.type === 'multi' && q.ids) {
                        const correctAnswers = q.ids.map(id => answerData[id].answer);
                        const studentAnswers = q.ids.map(id => (userAnswers[id] || "")).filter(a => a !== "");
                        
                        let groupCorrect = 0;
                        const tempCorrect = [...correctAnswers];
                        studentAnswers.forEach(ans => {
                            const idx = tempCorrect.findIndex(cAns => isMatch(ans, cAns));
                            if (idx !== -1) {
                                groupCorrect++;
                                tempCorrect.splice(idx, 1);
                            }
                        });
                        finalScore += groupCorrect;
                        q.ids.forEach(id => scoredIds.add(id));
                    }
                });
            });

            // 2. Chấm điểm các câu còn lại (MC, Inline, Cloze)
            for (let i = 1; i <= 40; i++) {
                if (scoredIds.has(i)) continue;
                if (checkIndividualAnswer(i)) finalScore++;
            }

            const b = (finalScore >= 39) ? 9.0 : (finalScore >= 37) ? 8.5 : (finalScore >= 35) ? 8.0 : (finalScore >= 33) ? 7.5 : (finalScore >= 30) ? 7.0 : (finalScore >= 27) ? 6.5 : (finalScore >= 23) ? 6.0 : (finalScore >= 19) ? 5.5 : (finalScore >= 15) ? 5.0 : (finalScore >= 13) ? 4.5 : (finalScore >= 10) ? 4.0 : 3.5;
            
            document.getElementById('score-display').innerText = b.toFixed(1);
            document.getElementById('raw-score-display').innerText = `${finalScore}/40 correct`;
            document.getElementById('result-modal').classList.remove('hidden');
        }

        function reviewTest() { 
            isReviewMode = true; 
            document.getElementById('result-modal').classList.add('hidden'); 
            document.getElementById('submit-btn').classList.add('hidden'); 
            document.getElementById('exit-btn').classList.remove('hidden'); 
            currentPage = 0; 
            renderPassage(); 
        }

        function gotoLoc(id) { 
            document.querySelectorAll('.highlight-location').forEach(el => el.classList.remove('highlight-location')); 
            const t = document.getElementById(id); 
            if (t) { 
                t.classList.add('highlight-location'); 
                t.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
            } 
        }
    </script>
</body>
</html>
