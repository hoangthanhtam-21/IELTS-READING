<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Reading Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        
        .split-container {
            height: calc(100vh - 140px);
        }

        .scroll-custom::-webkit-scrollbar {
            width: 8px;
        }
        .scroll-custom::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .scroll-custom::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }
        .scroll-custom::-webkit-scrollbar-thumb:hover {
            background: #999;
        }

        .highlight-location {
            background-color: #fef08a; /* Yellow-200 */
            font-weight: 600;
            padding: 0 2px;
            border-radius: 2px;
        }

        .question-dot {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
            font-weight: 600;
        }

        .question-dot.answered { background-color: #3b82f6; color: white; }
        .question-dot.unanswered { border: 2px solid #d1d5db; color: #4b5563; }
        .question-dot.current { border: 2px solid #3b82f6; background-color: #eff6ff; }
        .question-dot.correct { background-color: #22c55e; color: white; }
        .question-dot.wrong { background-color: #ef4444; color: white; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 overflow-hidden">

    <!-- Login Overlay -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-white">
        <div class="max-w-md w-full p-8 border rounded-xl shadow-lg bg-white">
            <h1 class="text-3xl font-bold mb-6 text-center text-blue-700">IELTS Reading Test</h1>
            <p class="text-gray-600 mb-6 text-center">Please enter your full name to start the simulation.</p>
            <input type="text" id="user-name" placeholder="Full Name" class="w-full p-3 border rounded-lg mb-4 focus:ring-2 focus:ring-blue-500 outline-none">
            <button onclick="startTest()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">Start Exam</button>
            <p class="mt-4 text-xs text-center text-gray-400 italic">Reading Module: 60 Minutes | 40 Questions</p>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-white border-b px-6 py-3 flex justify-between items-center shadow-sm relative z-10">
        <div class="flex items-center gap-4">
            <h2 class="text-xl font-bold text-blue-700">IELTS Simulation</h2>
            <span id="display-name" class="bg-gray-100 px-3 py-1 rounded-full text-sm font-medium">Candidate: ---</span>
        </div>
        
        <div id="timer" class="text-2xl font-mono font-bold text-red-600 bg-red-50 px-4 py-1 rounded-lg border border-red-200">
            60:00
        </div>

        <button id="submit-btn" onclick="confirmSubmit()" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700 transition">Submit Work</button>
        <button id="exit-review-btn" onclick="location.reload()" class="hidden bg-gray-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-gray-700 transition">Exit Review</button>
    </header>

    <!-- Main Content -->
    <main class="flex split-container">
        <!-- Passage Side -->
        <div id="passage-container" class="w-1/2 p-8 overflow-y-auto border-r bg-white scroll-custom prose max-w-none">
            <h1 id="passage-title" class="text-3xl font-serif font-bold mb-6 italic">Loading passage...</h1>
            <div id="passage-content" class="text-lg leading-relaxed space-y-4 font-serif text-gray-800">
                <!-- Text with ID spans for highlighting -->
            </div>
        </div>

        <!-- Questions Side -->
        <div id="questions-container" class="w-1/2 p-8 overflow-y-auto bg-gray-50 scroll-custom">
            <div id="questions-list" class="space-y-12">
                <!-- Questions injected here -->
            </div>
        </div>
    </main>

    <!-- Footer Navigation -->
    <footer class="fixed bottom-0 left-0 right-0 h-24 bg-white border-t px-6 py-3 flex items-center gap-3 overflow-x-auto">
        <div class="flex-shrink-0 font-bold text-gray-500 mr-2 uppercase text-xs tracking-wider">Questions:</div>
        <div id="nav-dots" class="flex gap-2">
            <!-- Navigation dots injected here -->
        </div>
    </footer>

    <!-- Score Result Modal -->
    <div id="result-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center bg-black bg-opacity-50">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center">
            <h2 class="text-2xl font-bold mb-2">Test Completed!</h2>
            <p class="text-gray-600 mb-6">Your IELTS Reading Score</p>
            <div class="text-6xl font-black text-blue-600 mb-2" id="score-display">0.0</div>
            <p class="text-lg font-medium text-gray-700 mb-6" id="raw-score-display">0/40 correct</p>
            <div class="flex flex-col gap-3">
                <button onclick="reviewTest()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">Review Answers</button>
                <button onclick="location.reload()" class="w-full text-gray-500 font-medium py-2 hover:underline">Try Another Test</button>
            </div>
        </div>
    </div>

    <script>
        let testData = null;
        let answerData = null;
        let userAnswers = {};
        let timeRemaining = 3600; // 60 minutes
        let timerInterval = null;
        let isReviewMode = false;

        async function loadTestData() {
            try {
                // Fetching from separate JSON files
                const [examRes, ansRes] = await Promise.all([
                    fetch('exam.json'),
                    fetch('answers.json')
                ]);
                testData = await examRes.json();
                answerData = await ansRes.json();
                
                renderTest();
            } catch (err) {
                console.error("Error loading data. Make sure files exist in the same folder.", err);
                document.getElementById('passage-content').innerHTML = "<p class='text-red-500'>Error loading exam data. Please ensure exam.json and answers.json are available on the server.</p>";
            }
        }

        function startTest() {
            const name = document.getElementById('user-name').value.trim();
            if (!name) {
                alert("Please enter your name");
                return;
            }
            document.getElementById('display-name').innerText = `Candidate: ${name}`;
            document.getElementById('login-screen').style.display = 'none';
            
            startTimer();
            loadTestData();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    submitTest();
                }
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeRemaining / 60);
            const secs = timeRemaining % 60;
            document.getElementById('timer').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function renderTest() {
            document.getElementById('passage-title').innerText = testData.title;
            document.getElementById('passage-content').innerHTML = testData.passage;
            
            const qList = document.getElementById('questions-list');
            const navDots = document.getElementById('nav-dots');
            qList.innerHTML = '';
            navDots.innerHTML = '';

            testData.questions.forEach((q, idx) => {
                const qNum = idx + 1;
                
                // Render Question UI
                const qEl = document.createElement('div');
                qEl.id = `q-block-${qNum}`;
                qEl.className = 'p-6 bg-white border rounded-xl shadow-sm transition';
                qEl.innerHTML = `
                    <div class="flex items-start gap-4">
                        <span class="bg-blue-600 text-white w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 font-bold">${qNum}</span>
                        <div class="flex-grow">
                            <p class="text-lg font-medium mb-4">${q.text}</p>
                            <div class="space-y-2" id="options-${qNum}">
                                ${q.type === 'multiple-choice' ? 
                                    q.options.map(opt => `
                                        <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50 transition">
                                            <input type="radio" name="q${qNum}" value="${opt}" onchange="saveAnswer(${qNum}, '${opt}')" class="w-4 h-4 text-blue-600">
                                            <span class="ml-3">${opt}</span>
                                        </label>
                                    `).join('') : 
                                    `<input type="text" placeholder="Type answer here..." oninput="saveAnswer(${qNum}, this.value)" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none uppercase font-semibold">`
                                }
                            </div>
                            <div id="explanation-${qNum}" class="hidden mt-4 p-4 bg-blue-50 border border-blue-100 rounded-lg text-sm text-blue-800"></div>
                        </div>
                    </div>
                `;
                qList.appendChild(qEl);

                // Render Nav Dot
                const dot = document.createElement('div');
                dot.id = `dot-${qNum}`;
                dot.className = 'question-dot unanswered';
                dot.innerText = qNum;
                dot.onclick = () => document.getElementById(`q-block-${qNum}`).scrollIntoView({ behavior: 'smooth' });
                navDots.appendChild(dot);
            });
        }

        function saveAnswer(qNum, value) {
            if (isReviewMode) return;
            userAnswers[qNum] = value.trim().toUpperCase();
            
            const dot = document.getElementById(`dot-${qNum}`);
            if (value.trim()) {
                dot.classList.remove('unanswered');
                dot.classList.add('answered');
            } else {
                dot.classList.remove('answered');
                dot.classList.add('unanswered');
            }
        }

        function confirmSubmit() {
            const answeredCount = Object.keys(userAnswers).length;
            const total = testData.questions.length;
            if (confirm(`You have answered ${answeredCount}/${total} questions. Do you want to submit?`)) {
                submitTest();
            }
        }

        function calculateBandScore(correct) {
            // Standard IELTS Reading (Academic) mapping roughly
            if (correct >= 39) return 9.0;
            if (correct >= 37) return 8.5;
            if (correct >= 35) return 8.0;
            if (correct >= 33) return 7.5;
            if (correct >= 30) return 7.0;
            if (correct >= 27) return 6.5;
            if (correct >= 23) return 6.0;
            if (correct >= 19) return 5.5;
            if (correct >= 15) return 5.0;
            if (correct >= 13) return 4.5;
            if (correct >= 10) return 4.0;
            return 3.5;
        }

        function submitTest() {
            clearInterval(timerInterval);
            let correctCount = 0;
            
            testData.questions.forEach((q, idx) => {
                const qNum = idx + 1;
                const userAns = userAnswers[qNum] || "";
                const correctAns = answerData[qNum].answer.toUpperCase();
                
                if (userAns === correctAns) {
                    correctCount++;
                }
            });

            const band = calculateBandScore(correctCount);
            document.getElementById('score-display').innerText = band.toFixed(1);
            document.getElementById('raw-score-display').innerText = `${correctCount}/${testData.questions.length} correct answers`;
            document.getElementById('result-modal').classList.remove('hidden');
        }

        function reviewTest() {
            isReviewMode = true;
            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('submit-btn').classList.add('hidden');
            document.getElementById('exit-review-btn').classList.remove('hidden');
            document.getElementById('timer').classList.add('hidden');

            testData.questions.forEach((q, idx) => {
                const qNum = idx + 1;
                const userAns = userAnswers[qNum] || "(No Answer)";
                const correctAns = answerData[qNum].answer.toUpperCase();
                const isCorrect = userAns === correctAns;

                const qBlock = document.getElementById(`q-block-${qNum}`);
                const dot = document.getElementById(`dot-${qNum}`);
                const expBox = document.getElementById(`explanation-${qNum}`);

                // Style Q block
                qBlock.classList.add(isCorrect ? 'border-green-500' : 'border-red-500');
                qBlock.classList.add(isCorrect ? 'bg-green-50' : 'bg-red-50');

                // Style Dot
                dot.className = `question-dot ${isCorrect ? 'correct' : 'wrong'}`;

                // Show Explanation
                expBox.classList.remove('hidden');
                expBox.innerHTML = `
                    <div class="font-bold mb-1">Result: ${isCorrect ? 'Correct' : 'Incorrect'}</div>
                    <div><strong>Your Answer:</strong> ${userAns}</div>
                    <div><strong>Correct Answer:</strong> ${correctAns}</div>
                    <div class="mt-2 pt-2 border-t border-blue-200"><strong>Explanation:</strong> ${answerData[qNum].explanation}</div>
                    <button onclick="highlightInPassage('${answerData[qNum].locationId}')" class="mt-3 text-blue-600 font-bold hover:underline flex items-center gap-1">
                        View in passage ↓
                    </button>
                `;
            });
        }

        function highlightInPassage(locationId) {
            // Remove previous highlights
            document.querySelectorAll('.highlight-location').forEach(el => {
                el.classList.remove('highlight-location');
            });

            const target = document.getElementById(locationId);
            if (target) {
                target.classList.add('highlight-location');
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    </script>
</body>
</html>
